name: ViewContent conformance

on:
  pull_request:
    paths:
      - "AppstentComposeLibray/**"
      - "build.gradle"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/viewcontent-conformance.yml"
  push:
    branches: [main]
    paths:
      - "AppstentComposeLibray/**"
      - "build.gradle"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/viewcontent-conformance.yml"
  workflow_dispatch:
    inputs:
      update_references:
        description: Generate Linux reference-image candidates instead of validating
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run structural tests
        run: ./gradlew :AppstentComposeLibray:testDebugUnitTest
      - name: Validate screenshot references
        if: ${{ !inputs.update_references }}
        run: ./gradlew :AppstentComposeLibray:validateDebugScreenshotTest
      - name: Generate Linux reference candidates
        if: ${{ inputs.update_references }}
        run: ./gradlew :AppstentComposeLibray:updateDebugScreenshotTest
      - name: Upload generated reference candidates
        if: ${{ inputs.update_references }}
        uses: actions/upload-artifact@v4
        with:
          name: appstent-compose-linux-references
          path: AppstentComposeLibray/src/screenshotTestDebug/reference
          retention-days: 14
      - name: Upload screenshot reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appstent-compose-screenshot-report
          path: |
            AppstentComposeLibray/build/reports/screenshotTest
            AppstentComposeLibray/build/reports/tests
            AppstentComposeLibray/build/test-results
          retention-days: 14
