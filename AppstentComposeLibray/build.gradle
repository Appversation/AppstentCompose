buildscript {
    repositories {
        mavenCentral()
    }
    ext {
        compose_ui_version = '1.9.4'
    }
}
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.android.compose.screenshot'
}

group = providers.gradleProperty('GROUP').get()
version = providers.gradleProperty('VERSION_NAME').get()

android {
    compileSdk 36
    defaultConfig {
        minSdk 26

        aarMetadata {
            minCompileSdk = 31
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        vectorDrawables {
            useSupportLibrary true
        }
    }


    publishing {
        singleVariant('release')
    }

    buildTypes {

        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility "17"
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    namespace 'com.appversation.appstentcompose'
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.3.2'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    lint {
        targetSdk 36
    }
    testOptions {
        targetSdk 36
    }
    experimentalProperties["android.experimental.enableScreenshotTest"] = true
    sourceSets {
        screenshotTest.assets.srcDir 'src/test/resources'
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId = project.group.toString()
                artifactId = 'appstent-compose'
                version = project.version.toString()

                from components.release
                
                // Add POM metadata
                pom {
                    name = 'appstent-compose'
                    description = 'Appstent Android Compose SDK'
                    url = 'https://github.com/Appversation/AppstentCompose'
                    licenses {
                        license {
                            name = 'Proprietary'
                            url = 'https://github.com/Appversation/AppstentCompose/blob/main/LICENSE'
                        }
                    }
                    developers {
                        developer {
                            id = 'appversation'
                            name = 'Asad Ather'
                            email = 'asad@appversation.com'
                        }
                    }
                    scm {
                        connection = 'scm:git:github.com/Appversation/AppstentCompose.git'
                        developerConnection = 'scm:git:ssh://github.com/Appversation/AppstentCompose.git'
                        url = 'https://github.com/Appversation/AppstentCompose'
                    }
                }
            }
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.hilt:hilt-navigation-compose:1.3.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation "androidx.compose.ui:ui:$compose_ui_version"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_ui_version"
    implementation "androidx.compose.foundation:foundation:$compose_ui_version"

    // Retained only for authored text and pixel-compatible legacy controls.
    implementation 'androidx.compose.material:material:1.9.4'
    implementation "androidx.compose.material:material-icons-extended:1.7.8"

    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.compose.material3:material3-window-size-class:1.4.0'

    implementation "io.coil-kt:coil-compose:2.7.0"
    implementation 'androidx.media3:media3-exoplayer:1.10.1'
    implementation 'androidx.media3:media3-ui:1.10.1'
    implementation 'org.commonmark:commonmark:0.21.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_ui_version"
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_ui_version"
    debugImplementation "androidx.compose.ui:ui-test-manifest:$compose_ui_version"
    screenshotTestImplementation 'com.android.tools.screenshot:screenshot-validation-api:0.0.1-alpha15'
    screenshotTestImplementation "androidx.compose.ui:ui-tooling:$compose_ui_version"
}
