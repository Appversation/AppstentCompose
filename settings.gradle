pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "AppstentCompose"

// Only include the app module if not building with JitPack
if (System.getenv("JITPACK") != "true") {
    include ':app'
}

// Always include the library module
include ':AppstentComposeLibray'
